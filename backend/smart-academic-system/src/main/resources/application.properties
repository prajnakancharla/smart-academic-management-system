
# Server Configuration
server.port=8080

# Application Name
spring.application.name=smart-academic-system

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_academic_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Frontend CORS Configuration
app.cors.allowed-origin=http://localhost:5173

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# File Storage Configuration
app.storage.directory=./uploads


# Initial Admin Account Configuration
app.bootstrap-admin.username=admin
app.bootstrap-admin.email=admin@gmail.com
app.bootstrap-admin.password=admin12345678
